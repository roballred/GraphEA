name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group test
      - run: python -m pytest

  write-boundaries:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block automated changes to curated and raw data
        env:
          HEAD_REF: ${{ github.head_ref }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$HEAD_REF" == auto/* || "$AUTHOR_TYPE" == "Bot" ]]; then
            changed=$(git diff --name-only "$BASE_SHA"...HEAD | grep -E '^data/(bronze|silver/reviewed)/' || true)
            if [ -n "$changed" ]; then
              echo "::error::Automated pull requests may not change data/silver/reviewed/ or data/bronze/"
              echo "$changed"
              exit 1
            fi
          fi
          echo "Write boundaries OK"
